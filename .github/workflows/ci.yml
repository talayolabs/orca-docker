name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning bin/orca-docker image/*.sh test/smoke.sh test/fixtures/*.sh
      - name: node syntax
        run: node --check image/mcp/computer-use/server.mjs && node --check test/fixtures/*.mjs

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: image
          tags: ghcr.io/talayolabs/orca-docker:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: ./test/smoke.sh
